[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triton-fused-rmsnorm-rope-swiglu"
version = "0.1.0"
description = "Fused Triton kernels for RMSNorm, RoPE and SwiGLU (forward + backward, autotuned)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "triton>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "numpy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
